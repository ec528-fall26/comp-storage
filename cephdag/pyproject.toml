[project]
name = "cephdag"
version = "3.0.0"
description = "Static task graphs on nodes that both store data in Ceph RADOS and compute on it"
requires-python = ">=3.9"
dependencies = ["numpy==2.0.2"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
